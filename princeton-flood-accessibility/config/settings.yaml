# Stage 1 settings for the Princeton baseline road network.
# Depth thresholds below are NOT applied to any road in this stage.

place:
  name: Princeton, New Jersey
  # The pinned NJGIN polygon is one municipality. These checks refuse a
  # different Princeton (the course materials include a West Virginia impostor).
  expected_area_km2: 47.66
  area_tolerance_km2: 0.05
  lon_range: [-75.0, -74.4]
  lat_range: [40.2, 40.5]

crs:
  geographic: EPSG:4326
  # NAD83 / New Jersey (ftUS), the realization used by the NJOGIS hosted
  # road-centerline layer ("Road Centerlines of NJ, Hosted, 3424").
  # EPSG:6539 is NAD83(2011) / New Jersey (ftUS). It was not selected because
  # mixing it with 3424 layers later would be a datum change, not a unit change.
  # EPSG:26918 (NAD83 / UTM zone 18N, metres) is used only to check area
  # against the course snapshot.
  projected: EPSG:3424
  projected_name: NAD83 / New Jersey (ftUS)
  area_check: EPSG:26918
  linear_unit: US survey foot
  # Exact definition. Code uses the fraction 1200/3937 rather than this decimal.
  us_survey_foot_m_exact: "1200/3937"

network:
  network_type: drive
  simplify: true
  # Keep disconnected pieces so the component count is a property of the
  # downloaded graph, not of a largest-component filter.
  retain_all: true
  # Keep a segment that crosses the municipal line, including the part of
  # the segment that sits just outside the polygon. Length inside the
  # municipality is computed separately by clipping.
  truncate_by_edge: true
  requests_timeout_s: 180

# Preliminary assumptions for a later scenario. They are not official
# NJDOT, FEMA, or Princeton closure standards, and they are not Hurricane Ida
# observations. Stage 1 does not compare any road to these depths.
thresholds:
  depth_m: [0.10, 0.30]
  status: preliminary_assumption
  applied_in_stage_1: false

paths:
  boundary: data/raw/princeton_boundary.geojson
  osmnx_cache: data/raw/osmnx_cache
  aadt_csv: data/raw/njdot_aadt_princeton_2024.csv
  hwm_csv: data/raw/usgs_ida_nj_high_water_marks_2021.csv
  gpkg: data/processed/princeton_drive_network.gpkg
  graphml: data/processed/princeton_drive_network.graphml
  centerlines_geojson: data/processed/princeton_drive_centerlines.geojson
  nodes_geojson: data/processed/princeton_drive_nodes.geojson
  edges_geojson: data/processed/princeton_drive_edges.geojson
  stats_json: data/processed/baseline_stats.json
  coverage_json: data/processed/ida_raster_coverage_check.json
  stats_csv: outputs/tables/baseline_road_stats.csv
  map_png: outputs/maps/princeton_baseline_drive_network.png

sources:
  aadt:
    url: https://www.nj.gov/transportation/refdata/roadway/mdb/TrafficCount2024DataSetwithAADTs.csv
    year: 2024
    publisher: NJDOT
  hwm:
    url: https://www.sciencebase.gov/catalog/file/get/616872bbd34e65377001107e?f=__disk__bb%2Faa%2Fa1%2Fbbaaa1df4a5b988e457eb1a1d48289fe30b91a5d
    doi: https://doi.org/10.5066/P9IWCH6T
    publisher: USGS
    item: https://www.sciencebase.gov/catalog/item/616872bbd34e65377001107e
  njogis_roads:
    url: https://njogis-newjersey.opendata.arcgis.com/maps/fc3d0a95921b4026b386643eef5ff088
    title: Road Centerlines of NJ, Hosted, 3424
    note: Not downloaded in stage 1. Cited as a later supplement, not as the baseline graph.
  ida_pa_depth_grids:
    note: >
      USGS depth grids for five Pennsylvania communities after Ida.
      They are not Princeton data. check_raster_coverage.py reads local
      copies and records whether their extents meet the municipal polygon.
    event: Remnants of Hurricane Ida, 1-2 September 2021
    metadata_url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Metadata-Ida_flood_products_PA.xml
    files:
      - name: chaddsford_depth_grid.tif
        url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Depth_grid_Chaddsford.zip
      - name: downingtown_depth_grid.tif
        url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Depth_grid_Downingtown.zip
      - name: modena_depth_grid.tif
        url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Depth_grid_Modena.zip
      - name: norristown_depth_grid.tif
        url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Depth_grid_Norristown.zip
      - name: perkiomen_depth_grid.tif
        url: https://pasda.psu.edu/download/usgs/Hurricane_Ida_Peak_Streamflow_and_Flooding_Data_PA_09-2023/Depth_grid_Perkiomen.zip
