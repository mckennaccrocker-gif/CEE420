# Princeton road network and the stage-2 flood scenario.
# 0.10 m and 0.30 m are preliminary labels, not closure standards.
# Stage 1 does not apply them. Stage 2 may attach them to scenario depths only.

place:
  name: Princeton, New Jersey
  # The pinned NJGIN polygon is one municipality. These checks refuse a
  # different Princeton (the course materials include a West Virginia impostor).
  expected_area_km2: 47.66
  area_tolerance_km2: 0.05
  lon_range: [-75.0, -74.4]
  lat_range: [40.2, 40.5]

crs:
  geographic: EPSG:4326
  # NAD83 / New Jersey (ftUS), the realization used by the NJOGIS hosted
  # road-centerline layer ("Road Centerlines of NJ, Hosted, 3424").
  # EPSG:6539 is NAD83(2011) / New Jersey (ftUS). It was not selected because
  # mixing it with 3424 layers later would be a datum change, not a unit change.
  # EPSG:26918 (NAD83 / UTM zone 18N, metres) is used only to check area
  # against the course snapshot.
  projected: EPSG:3424
  projected_name: NAD83 / New Jersey (ftUS)
  area_check: EPSG:26918
  linear_unit: US survey foot
  # Exact definition. Code uses the fraction 1200/3937 rather than this decimal.
  us_survey_foot_m_exact: "1200/3937"

network:
  network_type: drive
  simplify: true
  # Keep disconnected pieces so the component count is a property of the
  # downloaded graph, not of a largest-component filter.
  retain_all: true
  # Keep a segment that crosses the municipal line, including the part of
  # the segment that sits just outside the polygon. Length inside the
  # municipality is computed separately by clipping.
  truncate_by_edge: true
  requests_timeout_s: 180

# Preliminary assumptions. They are not official NJDOT, FEMA, or Princeton
# closure standards, and they are not Hurricane Ida observations.
# applied_in_stage_1 stays false so the baseline is not a flood run.
# applied_as_labels lets stage 2 mark scenario maxima with these cuts.
# Stage 2 does not remove edges. The accessibility block below is the
# stage-3 removal rule. It is still not an official closure standard.
thresholds:
  depth_m: [0.10, 0.30]
  status: preliminary_assumption
  applied_in_stage_1: false
  applied_as_labels: true
  not_closure_standards: true

# Stage 3 uses the same depth cuts as labels for routing status.
# A centerline is removed only when closure_piece_fraction of its inside
# length is at or above the upper cut. That rule is still not a closure
# standard. The two scenario stages are analyzed separately.
accessibility:
  closure_piece_fraction: 0.50
  aadt_max_snap_m: 30
  aadt_ambiguity_gap_m: 10
  destination_snap_max_m: 150
  critical_path_min_fraction: 0.5
  hurricane_ida_depth: false

# Hypothetical water surface used only because no depth raster intersects
# the municipal polygon. Not a Hurricane Ida simulation.
scenario:
  product: hypothetical_3dep_channel_relative_bathtub
  not_a_hurricane_ida_simulation: true
  # Metres added to the DEM elevation at the nearest mapped channel cell.
  # The two values are separate assumptions. They are not a time series.
  stage_above_channel_dem_m: [1.0, 2.0]
  primary_stage_m: 2.0
  max_channel_distance_m: 500
  # A channel cell higher than the road by more than this is treated as
  # uphill and is not that road's water surface. Stops a hillside tributary
  # from being laid across a lower street. A road more than this far below
  # every nearby channel cell is left unmatched rather than given the full
  # vertical gap as a depth.
  max_channel_above_road_m: 2.0
  sample_spacing_m: 10
  dem_pixel_m: 10
  # Extra margin downloaded around the municipality so a road on the
  # boundary can see a channel just outside it. This is not the depth cap.
  channel_buffer_m: 600
  hydrography:
    # NHD FType 460 StreamRiver, 558 Artificial Path (the path through
    # double-line rivers and lakes, including Carnegie Lake).
    flowline_ftypes: [460, 558]
    named_canals: ["Delaware and Raritan Canal"]
    waterbodies: ["Carnegie Lake"]

