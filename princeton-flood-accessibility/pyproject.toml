[project]
name = "princeton-flood-accessibility"
version = "0.1.0"
description = "Stage 1 baseline drivable road network for Princeton, NJ. Not a flood model."
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1,<2",
    "pyogrio>=0.13,<1",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "osmnx>=2.1,<3",
    "networkx>=3,<4",
    "matplotlib>=3.10,<4",
    "pyyaml>=6,<7",
    "pandas>=2",
    "rasterio>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = false
